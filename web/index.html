<title>For Gwen</title>
<meta name="theme-color" content="#030714">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap">
<style>
/* Layout: one full-screen WebGL stage; HTML overlays for the lock UI, captions and controls.
   Single deliberate look (night blue, silver, gold) on any host theme. */
:root {
  --navy-deep: #030714;
  --navy: #081430;
  --silver: #cdd6e4;
  --silver-dim: #8a96aa;
  --ice: #96c4ff;
  --gold: #e8bb5c;
  --gold-bright: #ffde96;
  --ink: #fff6e4;
  --display: "Cinzel", "Trajan Pro", Optima, Georgia, serif;
  --serif: "Cormorant Garamond", Garamond, Baskerville, Georgia, serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden; background: var(--navy-deep); color: var(--ink);
  font-family: var(--serif); -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation;
}
#stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
.vignette {
  position: fixed; inset: 0; pointer-events: none;
  background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 55%, rgba(0,0,0,.55) 100%);
}
.flash { position: fixed; inset: 0; pointer-events: none; background: #ffdf9a; opacity: 0; mix-blend-mode: screen; }
.bar { position: fixed; left: 0; right: 0; height: 0; background: #000; transition: height 1.8s cubic-bezier(.65,0,.35,1); pointer-events: none; }
.bar.top { top: 0; } .bar.bottom { bottom: 0; }
body.cinema.landscape .bar { height: 7.5vh; }

/* ---------- lock screen */
#lock {
  position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
  padding-top: calc(env(safe-area-inset-top, 0px) + 7vh);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  transition: opacity .8s ease; text-align: center;
}
#lock.gone { opacity: 0; pointer-events: none; }
.eyebrow {
  font-family: var(--display); font-weight: 400; letter-spacing: .32em; text-transform: uppercase;
  color: var(--silver); font-size: clamp(15px, 2.1vw, 26px); margin: 0; padding-left: .32em;
}
.sub { font-style: italic; color: var(--ice); font-size: clamp(19px, 2.4vw, 30px); margin: .35em 0 0; }
.ornament { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
.ornament i { display: block; width: clamp(60px, 9vw, 110px); height: 1px; background: var(--gold); opacity: .8; }
.ornament b { width: 8px; height: 8px; background: var(--gold); transform: rotate(45deg); }
#form {
  position: absolute; left: 0; right: 0; top: 74%;
  display: flex; flex-direction: column; align-items: center; gap: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body.portrait #form { top: 64%; }
.field { position: relative; width: min(430px, 100%); }
#pw {
  width: 100%; box-sizing: border-box; height: 58px; border-radius: 29px;
  background: rgba(8,18,44,.78); border: 2px solid var(--gold); outline: none;
  box-shadow: inset 0 0 0 4px rgba(8,18,44,.78), inset 0 0 0 5px rgba(205,214,228,.28), 0 0 28px rgba(232,187,92,.18);
  color: var(--gold-bright); text-align: center; font-family: var(--serif); font-size: 26px;
  letter-spacing: .35em; padding: 0 20px; caret-color: var(--gold-bright);
  -webkit-appearance: none; appearance: none;
}
#pw::placeholder { color: var(--silver-dim); font-style: italic; letter-spacing: 0; font-size: 24px; }
#pw:focus-visible { border-color: var(--gold-bright); box-shadow: inset 0 0 0 4px rgba(8,18,44,.78), inset 0 0 0 5px rgba(205,214,228,.35), 0 0 36px rgba(255,222,150,.32); }
.shake { animation: shake .6s cubic-bezier(.36,.07,.19,.97); }
@keyframes shake { 10%,90%{transform:translateX(-2px)} 20%,80%{transform:translateX(5px)} 30%,50%,70%{transform:translateX(-10px)} 40%,60%{transform:translateX(10px)} }
#unlock {
  font-family: var(--display); letter-spacing: .4em; text-transform: uppercase; font-size: 13px;
  color: var(--navy-deep); background: linear-gradient(180deg, var(--gold-bright), var(--gold));
  border: 0; border-radius: 22px; height: 44px; padding: 0 26px 0 calc(26px + .4em); cursor: pointer;
  box-shadow: 0 6px 24px rgba(232,187,92,.25);
}
#unlock:focus-visible { outline: 2px solid var(--ice); outline-offset: 3px; }
.msg { min-height: 1.4em; font-style: italic; font-size: 21px; color: var(--ice); margin: 0; transition: opacity .6s; }
.hint { font-style: italic; font-size: 19px; color: var(--gold); margin: 0; opacity: 0; transition: opacity 1s; }
.hint.on { opacity: .9; }
.small {
  font-family: var(--display); letter-spacing: .38em; text-transform: uppercase; font-size: 11px; color: var(--silver-dim);
}

/* ---------- story */
#captions {
  position: fixed; left: 0; right: 0; bottom: 10vh; display: grid; place-items: end center; pointer-events: none;
  padding-left: max(18px, env(safe-area-inset-left, 0px));
  padding-right: max(18px, env(safe-area-inset-right, 0px));
}
body.portrait #captions { bottom: calc(env(safe-area-inset-bottom, 0px) + 13vh); }
.cap {
  grid-area: 1 / 1; text-align: center; width: min(100%, 980px); display: flex; flex-direction: column; align-items: center; gap: .3em;
  opacity: 0; filter: blur(8px); transform: translateY(14px);
  transition: opacity 1.6s cubic-bezier(.45,0,.2,1), filter 1.8s cubic-bezier(.45,0,.2,1), transform 2.4s cubic-bezier(.2,.7,.2,1);
}
.cap.in { opacity: 1; filter: blur(0); transform: none; }
.cap.out { opacity: 0; filter: blur(4px); transform: none; transition-duration: 1.2s; }
.cap span { display: block; text-wrap: balance; text-shadow: 0 2px 14px rgba(0,0,0,.85), 0 0 26px rgba(52,104,214,.55); }
.lead { font-size: clamp(22px, 3.4vw, 44px); color: var(--ink); font-weight: 500; line-height: 1.15; }
.italic { font-style: italic; font-size: clamp(19px, 2.7vw, 36px); color: var(--ice); line-height: 1.2; }
.gold { font-style: italic; font-size: clamp(22px, 2.9vw, 38px); color: var(--gold-bright); text-shadow: 0 2px 14px rgba(0,0,0,.85), 0 0 26px rgba(168,120,44,.7) !important; }
.hero {
  font-family: var(--display); font-weight: 500; letter-spacing: .22em; padding-left: .22em; text-transform: uppercase;
  font-size: clamp(24px, 4.4vw, 58px); color: var(--gold-bright); line-height: 1.2;
  text-shadow: 0 2px 16px rgba(0,0,0,.85), 0 0 30px rgba(232,187,92,.55) !important;
}
#track {
  position: fixed; left: max(24px, env(safe-area-inset-left, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 9vh);
  display: flex; align-items: center; gap: 12px; opacity: 0; transition: opacity 2s; pointer-events: none;
}
#track i { width: 24px; height: 1px; background: #a8782c; }
#track.on { opacity: .8; }
.ctl {
  position: fixed; top: calc(env(safe-area-inset-top, 0px) + 14px); right: max(14px, env(safe-area-inset-right, 0px));
  background: rgba(8,18,44,.55); border: 1px solid rgba(205,214,228,.25); border-radius: 18px; height: 36px; padding: 0 14px 0 calc(14px + .38em);
  color: var(--silver); cursor: pointer; opacity: 0; pointer-events: none; transition: opacity 1.5s;
}
.ctl.on { opacity: .75; pointer-events: auto; }
.ctl:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
#again {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 3vh);
  background: none; border: 0; padding: 10px 16px 10px calc(16px + .38em); cursor: pointer; opacity: 0; pointer-events: none; transition: opacity 2s;
}
#again.on { opacity: .85; pointer-events: auto; }
#again:focus-visible { outline: 1px solid var(--gold); }
/* ---------- thumbprint step */
#thumb {
  position: fixed; left: 0; right: 0; top: 66%; display: flex; flex-direction: column; align-items: center; gap: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  opacity: 0; pointer-events: none; transition: opacity .9s ease; text-align: center;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
}
body.portrait #thumb { top: 58%; }
body.landscape #thumb { top: 66%; gap: 8px; }
#thumb.on { opacity: 1; pointer-events: auto; }
#thumb.done { opacity: 0; pointer-events: none; }
.thumb-title { text-wrap: balance; max-width: 22em; font-style: italic; font-size: clamp(21px, 2.4vw, 30px); color: var(--ink); margin: 0; }
#pad {
  position: relative; width: 132px; height: 132px; border-radius: 50%; border: 0; padding: 0; cursor: pointer;
  background: radial-gradient(circle at 50% 45%, rgba(26,48,100,.9), rgba(6,14,36,.92) 70%);
  box-shadow: 0 0 0 1px rgba(205,214,228,.22), 0 0 40px rgba(52,104,214,.35);
  touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
}
#pad:focus-visible { outline: 2px solid var(--ice); outline-offset: 6px; }
#pad svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
#pad .ridges path { fill: none; stroke-linecap: round; stroke-width: 2.1; }
#pad .dim path { stroke: rgba(232,187,92,.38); }
#pad .lit path { stroke: var(--gold-bright); filter: drop-shadow(0 0 3px rgba(255,222,150,.9)); }
#pad .ring-bg { fill: none; stroke: rgba(205,214,228,.18); stroke-width: 3; }
#pad .ring { fill: none; stroke: var(--gold); stroke-width: 3.5; stroke-linecap: round; filter: drop-shadow(0 0 4px rgba(232,187,92,.8)); }
#pad .scan { fill: url(#scanGrad); }
#pad.idle { animation: padPulse 2.4s ease-in-out infinite; }
@keyframes padPulse { 0%, 100% { box-shadow: 0 0 0 1px rgba(205,214,228,.22), 0 0 34px rgba(52,104,214,.3); } 50% { box-shadow: 0 0 0 1px rgba(232,187,92,.55), 0 0 54px rgba(232,187,92,.35); } }
.thumb-hint { min-height: 1.3em; font-style: italic; font-size: 19px; color: var(--ice); margin: 0; }
#next {
  position: fixed; left: 0; right: 0; margin: 0; text-align: center; pointer-events: none;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 3.2vh); color: var(--gold); padding-left: .38em;
  opacity: 0; transition: opacity 1.2s ease;
}
#next.on { opacity: .85; animation: breathe 2.8s ease-in-out 1.2s infinite; }
@keyframes breathe { 0%, 100% { opacity: .85; } 50% { opacity: .35; } }
body.landscape #next { bottom: 2.2vh; color: var(--gold-bright); }
@media (prefers-reduced-motion: reduce) { .cap { transition-duration: .8s; transform: none; filter: none; } }
</style>

<canvas id="stage" aria-hidden="true"></canvas>
<div class="vignette"></div>
<div class="bar top"></div><div class="bar bottom"></div>
<div class="flash" id="flash"></div>

<section id="lock" aria-label="Locked message">
  <h1 class="eyebrow">I owe you something.</h1>
  <p class="sub">It's locked. The key is a promise.</p>
  <div class="ornament" aria-hidden="true"><i></i><b></b><i></i></div>
</section>
<form id="form" autocomplete="off" novalidate>
  <p class="msg" id="msg" aria-live="polite"></p>
  <div class="field" id="field">
    <label for="pw" class="small" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Password</label>
    <input id="pw" type="password" inputmode="text" autocapitalize="none" autocorrect="off" spellcheck="false"
           enterkeyhint="go" placeholder="enter the password" autocomplete="off">
  </div>
  <button id="unlock" type="submit">Unlock</button>
  <p class="hint" id="hint">hint: the promise, in one word, no spaces</p>
  <p class="small" id="sound">Sound on, please</p>
</form>

<section id="thumb" aria-label="Thumbprint">
  <p class="thumb-title">Now press and hold your thumb here to unlock it.</p>
  <button id="pad" class="idle" type="button" aria-label="Press and hold to unlock">
    <svg viewBox="-66 -66 132 132" aria-hidden="true">
      <defs>
        <linearGradient id="scanGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffde96" stop-opacity="0"/><stop offset=".85" stop-color="#ffde96" stop-opacity=".55"/><stop offset="1" stop-color="#fff6e4" stop-opacity=".9"/>
        </linearGradient>
        <clipPath id="fill"><rect id="fillRect" x="-66" y="66" width="132" height="132"/></clipPath>
      </defs>
      <circle class="ring-bg" r="60"/>
      <circle class="ring" id="ring" r="60" transform="rotate(-90)" stroke-dasharray="377" stroke-dashoffset="377"/>
      <g class="ridges dim" id="ridgesDim"></g>
      <g class="ridges lit" id="ridgesLit" clip-path="url(#fill)"></g>
      <rect class="scan" id="scanBar" x="-44" y="66" width="88" height="14" rx="7" opacity="0"/>
    </svg>
  </button>
  <p class="small">Hold until the ring is full</p>
  <p class="thumb-hint" id="thumbHint" aria-live="polite"></p>
</section>

<div id="captions" aria-live="polite"></div>
<div id="track" class="small"><i></i><span>About You &nbsp;—&nbsp; The 1975</span></div>
<button class="ctl small" id="mute" type="button">Mute</button>
<button class="small" id="again" type="button">Watch again</button>
<p class="small" id="next" aria-live="polite">Tap to continue</p>

<audio id="song" src="about_you.mp3" preload="auto" playsinline></audio>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
const NAME = 'Gwen', SIGNATURE = '— with love, Hadia';
const PW_SHA256 = 'bdce740bd0b257bc5e17e3ef4659240fcdeb09fcbd97ee142fbd87b54e4f99a5'; // the promise, lower-case
const N = 2300;

/* ================================================================ helpers */
const TAU = Math.PI * 2;
const clamp01 = x => x < 0 ? 0 : x > 1 ? 1 : x;
const smooth = (a, b, x) => { const t = clamp01((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const easeInOut = t => (t = clamp01(t), t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const easeOutBack = (t, s = 2.2) => (t = clamp01(t) - 1, 1 + t * t * ((s + 1) * t + s));
const lerp = (a, b, t) => a + (b - a) * t;
let seed = 1975;
const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
const gauss = () => { let u = 0, v = 0; while (!u) u = rnd(); while (!v) v = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * v); };
const pick = arr => arr[(rnd() * arr.length) | 0];
function m3mul(a, b) { const r = new Array(9); for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) r[i*3+j] = a[i*3]*b[j] + a[i*3+1]*b[3+j] + a[i*3+2]*b[6+j]; return r; }
const rotX = a => { const c = Math.cos(a), s = Math.sin(a); return [1,0,0, 0,c,-s, 0,s,c]; };
const rotY = a => { const c = Math.cos(a), s = Math.sin(a); return [c,0,s, 0,1,0, -s,0,c]; };
const rotZ = a => { const c = Math.cos(a), s = Math.sin(a); return [c,-s,0, s,c,0, 0,0,1]; };
function axisRot(ax, a) {
  const l = Math.hypot(ax[0], ax[1], ax[2]), x = ax[0]/l, y = ax[1]/l, z = ax[2]/l, c = Math.cos(a), s = Math.sin(a), t = 1 - c;
  return [t*x*x+c, t*x*y-s*z, t*x*z+s*y, t*x*y+s*z, t*y*y+c, t*y*z-s*x, t*x*z-s*y, t*y*z+s*x, t*z*z+c];
}
function apply(m, P, i, out, j) { const x = P[i], y = P[i+1], z = P[i+2];
  out[j] = m[0]*x + m[1]*y + m[2]*z; out[j+1] = m[3]*x + m[4]*y + m[5]*z; out[j+2] = m[6]*x + m[7]*y + m[8]*z; }

/* colour slots */
const GOLD = 0, SILVER = 1, BLUE = 2, ICE = 3, GOLD_HI = 4, WHITE = 5;
const PAL = [[236*.8,158*.8,38*.8],[205,214,228],[52,104,214],[150,196,255],[250*.85,196*.85,84*.85],[255,246,228]].map(c => c.map(v => v / 255));

/* ================================================================ renderer */
const canvas = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 100);
const T20 = Math.tan(THREE.MathUtils.degToRad(20));
let W = 1, H = 1, portrait = false, halfH = 2.6, storyY = .45;

/* background: gradient, drifting light clouds, dither - all in one full-screen shader */
const bgMat = new THREE.ShaderMaterial({
  depthTest: false, depthWrite: false, toneMapped: false,
  uniforms: { uTime: { value: 0 }, uAspect: { value: 1 } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.999, 1.0); }',
  fragmentShader: `
    varying vec2 vUv; uniform float uTime; uniform float uAspect;
    float blob(vec2 p, vec2 c, float r){ vec2 d = p - c; d.x *= uAspect; return pow(clamp(1.0 - length(d) / r, 0.0, 1.0), 2.4); }
    float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
    void main(){
      vec2 p = vUv;
      vec3 top = vec3(3.0, 7.0, 20.0) / 255.0, bot = vec3(8.0, 20.0, 48.0) / 255.0;
      vec3 col = mix(bot, top, p.y);
      col += vec3(14.0, 34.0, 78.0) / 255.0 * 0.9 * blob(p, vec2(0.5, 0.55), 0.95);
      float t = uTime;
      col += vec3(52.0, 104.0, 214.0) / 255.0 * 0.16 * blob(p, vec2(0.5 + 0.32 * sin(t * 0.05), 0.5 + 0.22 * cos(t * 0.04)), 0.75);
      col += vec3(30.0, 60.0, 150.0) / 255.0 * 0.14 * blob(p, vec2(0.5 + 0.32 * sin(t * 0.05 + 2.1), 0.5 + 0.22 * cos(t * 0.04 + 1.3)), 0.9);
      col += vec3(168.0, 120.0, 44.0) / 255.0 * 0.07 * blob(p, vec2(0.5 + 0.32 * sin(t * 0.05 + 4.2), 0.5 + 0.22 * cos(t * 0.04 + 2.6)), 0.5);
      col += (hash(p * 913.0 + t) - 0.5) / 255.0;
      gl_FragColor = vec4(col, 1.0);
    }`
});
const bg = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), bgMat);
bg.frustumCulled = false; bg.renderOrder = -10; scene.add(bg);

/* point sprites shared by stars and the particle field */
function pointMaterial(exposure) {
  return new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, toneMapped: false,
    uniforms: { uScale: { value: 1 }, uExposure: { value: exposure }, uTime: { value: 0 } },
    vertexShader: `
      attribute vec3 color; attribute float size; attribute float tw;
      uniform float uScale; uniform float uTime; varying vec3 vColor; varying float vB;
      void main(){
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        gl_Position = projectionMatrix * mv;
        float z = -mv.z;
        gl_PointSize = max(1.5, size * uScale / z);
        vColor = color;
        vB = clamp(1.35 - (z - 4.0) / 6.0, 0.25, 1.0) * (tw > 0.0 ? 0.55 + 0.45 * sin(uTime * 1.3 + tw) : 1.0);
      }`,
    fragmentShader: `
      varying vec3 vColor; varying float vB; uniform float uExposure;
      void main(){
        float d = length(gl_PointCoord - 0.5) * 2.0;
        if (d > 1.0) discard;
        float core = exp(-d * d * 18.0) * 0.85;
        float halo = exp(-d * d * 4.5) * 0.3;
        float hot = clamp(core - 0.5, 0.0, 1.0) * 0.6;
        gl_FragColor = vec4((vColor * (core + halo) + vec3(hot)) * vB * uExposure, 1.0);
      }`
  });
}

/* starfield */
const STARS = 520;
const starGeo = new THREE.BufferGeometry();
{
  const p = new Float32Array(STARS * 3), c = new Float32Array(STARS * 3), s = new Float32Array(STARS), tw = new Float32Array(STARS);
  for (let i = 0; i < STARS; i++) {
    p[i*3] = (rnd() * 2 - 1) * 16; p[i*3+1] = (rnd() * 2 - 1) * 12; p[i*3+2] = -26 + rnd() * 29;
    const col = PAL[pick([SILVER, ICE, ICE, BLUE, WHITE, GOLD])]; c.set(col, i * 3);
    s[i] = 0.12; tw[i] = 0.01 + rnd() * TAU;
  }
  starGeo.setAttribute('position', new THREE.BufferAttribute(p, 3));
  starGeo.setAttribute('color', new THREE.BufferAttribute(c, 3));
  starGeo.setAttribute('size', new THREE.BufferAttribute(s, 1));
  starGeo.setAttribute('tw', new THREE.BufferAttribute(tw, 1));
}
const starMat = pointMaterial(0.75);
const stars = new THREE.Points(starGeo, starMat); stars.frustumCulled = false; scene.add(stars);

/* ================================================================ the padlock */
function envTexture() {
  const c = document.createElement('canvas'); c.width = 1024; c.height = 512;
  const g = c.getContext('2d');
  const grd = g.createLinearGradient(0, 0, 0, 512);
  grd.addColorStop(0, '#ffffff'); grd.addColorStop(.3, '#d3dbea'); grd.addColorStop(.48, '#8592ad');
  grd.addColorStop(.62, '#3a4766'); grd.addColorStop(1, '#1a2340');
  g.fillStyle = grd; g.fillRect(0, 0, 1024, 512);

  { shape: () => haloHeart(N), stagger: 1.5, pulse: .03, sway: .35, orbit: .22, caps: [[[["No games anymore.", 'hero'], ["That's the promise. That's the key.", 'gold']], 1.6, 8]] },
  { shape: null, pulse: .035, sway: .5, orbit: .22, caps: [[[["Take all the time you need.", 'lead'], ["I'll be here — and I'll be better.", 'italic']], 1, 0]] },
  { shape: null, final: true, pulse: .035, sway: .5, orbit: .22, caps: [[[[`For ${NAME},`, 'italic'], ["I'm sorry.", 'gold'], [SIGNATURE, 'italic']], 1.4, 0]] },
];
/* the story moves on only when she taps / clicks / presses Enter; each line waits at most this long to appear */
const MAX_CAPTION_DELAY = 2.2;
const capBox = document.getElementById('captions');
let sceneI = -1, sceneT0 = 0, caps = [], sway = 0, swayTarget = 0, exposure = 1, exposureTarget = 1;
function startScene(i, now) {
  i = Math.min(i, SCENES.length - 1); const sc = SCENES[i]; sceneI = i; sceneT0 = now;
  if (sc.shape) setShape(sc.shape(), now, sc);
  else { F.spin = sc.spin ?? F.spin; F.pulse = sc.pulse ?? F.pulse; F.turb = sc.turbulence || 0; F.k = sc.stiffness ?? F.k; }
  F.orbitSpeed = sc.orbit || 0; swayTarget = sc.sway ?? .25; exposureTarget = sc.exposure ?? 1;
  capBox.querySelectorAll('.cap').forEach(el => { el.classList.add('out'); el.classList.remove('in'); setTimeout(() => el.remove(), 1500); });
  caps = sc.caps.map(([lines, st, dur]) => {
    const el = document.createElement('div'); el.className = 'cap';
    lines.forEach(([t, cls]) => { const s = document.createElement('span'); s.className = cls; s.textContent = t; el.appendChild(s); });
    capBox.appendChild(el); return { el, st: Math.min(st, MAX_CAPTION_DELAY), state: 0 };
  });
  document.getElementById('again').classList.remove('on');
  prompt_.classList.remove('on');
}
/* turning the page */
const prompt_ = document.getElementById('next');
prompt_.textContent = matchMedia('(pointer: coarse)').matches ? 'Tap to continue' : 'Click or press Enter to continue';
function ready() { return state === 'story' && !SCENES[sceneI].final && caps.length && now - sceneT0 >= caps[0].st + .9; }
function advance() { if (ready()) startScene(sceneI + 1, now); }
window.addEventListener('pointerup', e => { if (!e.target.closest('button, input, a')) advance(); });
window.addEventListener('keydown', e => {
  if (state !== 'story' || e.target.closest('input')) return;
  if (e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowRight') { if (!e.target.closest('button')) { e.preventDefault(); advance(); } }
});
function updateCaptions(now) {
  const lt = now - sceneT0;
  for (const c of caps) {
    if (c.state === 0 && lt >= c.st) { c.state = 1; c.el.classList.add('in'); }
  }
  const sc = SCENES[sceneI];
  if (sc.final) { if (lt > 5) document.getElementById('again').classList.add('on'); }
  else if (caps.length && lt >= caps[0].st + 2.2) prompt_.classList.add('on');
}

/* ================================================================ music (Web Audio so fades work on iPhone) */
const song = document.getElementById('song');
let actx = null, gain = null, vol = 0, volTarget = 0, muted = false;
function startMusic(target) {
  volTarget = target;
  try {
    if (!actx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      actx = new AC(); gain = actx.createGain(); gain.gain.value = 0;
      actx.createMediaElementSource(song).connect(gain); gain.connect(actx.destination);
    }
    if (actx.state === 'suspended') actx.resume();
  } catch (e) { gain = null; song.volume = 1; }
  if (song.paused) { const p = song.play(); if (p && p.catch) p.catch(() => {}); }
}
song.loop = true;
function updateMusic(dt) {
  const goal = muted ? 0 : volTarget; vol += (goal - vol) * Math.min(1, dt * .9);
  if (gain) gain.gain.value = vol;
}
document.getElementById('mute').addEventListener('click', e => { muted = !muted; e.currentTarget.textContent = muted ? 'Sound on' : 'Mute'; startMusic(volTarget); });
/* music starts softly on the first touch of the lock screen */
const firstTouch = () => { if (state === 'lock') startMusic(.35); window.removeEventListener('pointerdown', firstTouch); };
window.addEventListener('pointerdown', firstTouch);

/* ================================================================ lock screen */
let state = 'lock', unlockT = 0, attempts = 0, now = 0;
const form = document.getElementById('form'), pw = document.getElementById('pw'), field_ = document.getElementById('field'), msg = document.getElementById('msg');
async function sha256(s) {
  if (window.crypto && crypto.subtle) { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
  return null;
}
form.addEventListener('submit', async e => {
  e.preventDefault();
  if (state !== 'lock') return;
  startMusic(.35);                                   // inside the tap: allowed to start sound
  const guess = pw.value.toLowerCase();
  const h = await sha256(guess);
  const ok = h ? h === PW_SHA256 : guess === ['no', 'games', 'anymore'].join('');
  if (ok) {
    state = 'thumb'; pw.blur();
    form.style.transition = 'opacity .8s'; form.style.opacity = 0; form.style.pointerEvents = 'none';
    document.querySelector('#lock .sub').textContent = 'The promise is right. One last thing.';
    setTimeout(() => thumbEl.classList.add('on'), 700);
  } else {
    attempts++; pw.value = ''; msg.textContent = 'Not quite. Take your time.'; msg.style.opacity = 1;
    field_.classList.remove('shake'); void field_.offsetWidth; field_.classList.add('shake');
    clearTimeout(form._t); form._t = setTimeout(() => { msg.style.opacity = 0; }, 2600);
    if (attempts >= 2) document.getElementById('hint').classList.add('on');
  }
});

/* ================================================================ thumbprint */
const thumbEl = document.getElementById('thumb'), pad = document.getElementById('pad'), thumbHint = document.getElementById('thumbHint');
const ring = document.getElementById('ring'), fillRect = document.getElementById('fillRect'), scanBar = document.getElementById('scanBar');
(function drawRidges() {
  /* a stylised fingerprint: nested, slightly broken loops */
  let d = '';
  for (let k = 0; k < 12; k++) {
    const rx = 6 + k * 3.7, ry = 8 + k * 4.4, cy = 6 - k * .9;
    const gap = .55 + (k % 3) * .18, a0 = Math.PI / 2 + gap, a1 = Math.PI / 2 + TAU - gap;
    const brk = k > 2 && k % 2 ? a0 + (a1 - a0) * (.3 + .1 * (k % 4)) : null;
    const seg = (s, e) => { const p = []; for (let i = 0; i <= 28; i++) { const a = s + (e - s) * i / 28; p.push(`${(Math.cos(a) * rx).toFixed(2)},${(cy + Math.sin(a) * ry).toFixed(2)}`); } return 'M' + p.join('L'); };
    d += brk ? seg(a0, brk - .12) + seg(brk + .12, a1) : seg(a0, a1);
  }
  for (const id of ['ridgesDim', 'ridgesLit']) {
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path'); path.setAttribute('d', d);
    document.getElementById(id).appendChild(path);
  }
})();
let holding = false, thumbP = 0, lockYCur = null, lockSCur = null;
const HOLD_SECONDS = 2.2;
function press(e) { if (state !== 'thumb') return; if (e) e.preventDefault(); holding = true; thumbHint.textContent = ''; pad.classList.remove('idle');
  startMusic(.35); try { navigator.vibrate && navigator.vibrate(15); } catch (_) {} }
function release() { if (!holding) return; holding = false;
  if (state === 'thumb' && thumbP < 1) { if (thumbP > .04) thumbHint.textContent = 'Hold a little longer.'; pad.classList.add('idle'); } }
pad.addEventListener('pointerdown', e => { pad.setPointerCapture && pad.setPointerCapture(e.pointerId); press(e); });
pad.addEventListener('pointerup', release); pad.addEventListener('pointercancel', release); pad.addEventListener('lostpointercapture', release);
pad.addEventListener('contextmenu', e => e.preventDefault());
pad.addEventListener('keydown', e => { if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) press(e); });
pad.addEventListener('keyup', e => { if (e.key === ' ' || e.key === 'Enter') release(); });
let lastThumbT = performance.now();
function updateThumb() {
  const t = performance.now(), dt = Math.min(.1, (t - lastThumbT) / 1000); lastThumbT = t;   // real time, not frame-capped
  thumbP = clamp01(thumbP + (holding ? dt / HOLD_SECONDS : -dt * 1.2));
  const e = easeInOut(thumbP);
  ring.setAttribute('stroke-dashoffset', (377 * (1 - thumbP)).toFixed(1));
  const y = 66 - 132 * e; fillRect.setAttribute('y', y.toFixed(1));
  scanBar.setAttribute('y', (y - 7).toFixed(1)); scanBar.setAttribute('opacity', holding && e < .96 ? .9 : 0);
  goldGlow.material.opacity = thumbP * .35;
  if (thumbP >= 1) {
    holding = false; state = 'unlocking'; unlockT = now; thumbHint.textContent = '';
    try { navigator.vibrate && navigator.vibrate([20, 40, 30]); } catch (_) {}
    thumbEl.classList.add('done'); document.getElementById('lock').classList.add('gone');
  }
}

function beginStory() {
  /* the lock becomes particles exactly where it stood */
  lock.updateMatrixWorld(true);
  const pts = [], cols = [];
  samplePoints(body, Math.floor(N * .72), pts, cols, [GOLD, GOLD, GOLD, GOLD_HI]);
  pts._start = pts.length;
  samplePoints(shMesh, N - pts.length, pts, cols, [SILVER, SILVER, ICE]);
  while (pts.length < N) { pts.push(pts[(rnd() * pts.length) | 0]); cols.push(GOLD); }
  field.position.y = storyY; field.rotation.set(0, 0, 0); field.updateMatrixWorld(true);
  const inv = field.matrixWorld.clone().invert(), v = new THREE.Vector3();
  for (let i = 0; i < N; i++) { v.set(...pts[i]).applyMatrix4(inv); F.pos.set([v.x, v.y, v.z], i * 3); F.col.set(PAL[cols[i]], i * 3); }
  let cx = 0, cy = 0, cz = 0; for (let i = 0; i < N; i++) { cx += F.pos[i*3]; cy += F.pos[i*3+1]; cz += F.pos[i*3+2]; } cx /= N; cy /= N; cz /= N;
  for (let i = 0; i < N; i++) { const j = i * 3; let dx = F.pos[j] - cx, dy = F.pos[j+1] - cy, dz = F.pos[j+2] - cz; const l = Math.hypot(dx, dy, dz) || 1, s = 3.4 * (.4 + rnd());
    F.vel[j] = dx / l * s + gauss() * .7; F.vel[j+1] = dy / l * s + gauss() * .7; F.vel[j+2] = dz / l * s + gauss() * .7; }
  lock.visible = false; field.visible = true; state = 'story';
  const fl = document.getElementById('flash'); fl.style.transition = 'none'; fl.style.opacity = .08; void fl.offsetWidth; fl.style.transition = 'opacity 1.4s ease-out'; fl.style.opacity = 0;
  document.body.classList.add('cinema'); volTarget = .9;
  startScene(0, now); F.tChange = now + .6;
  document.getElementById('mute').classList.add('on');
  const tr = document.getElementById('track'); setTimeout(() => tr.classList.add('on'), 3000); setTimeout(() => tr.classList.remove('on'), 12500);
}
document.getElementById('again').addEventListener('click', () => {
  setShape(sphere(N), now, { stagger: .8, spin: .2 });
  for (let i = 0; i < N * 3; i++) F.vel[i] += gauss() * 1.6;
  startScene(0, now); startMusic(.9);
});

/* ================================================================ frame */
function resize() {
  W = window.innerWidth; H = window.innerHeight; const aspect = W / H; portrait = aspect < 1;
  document.body.classList.toggle('portrait', portrait); document.body.classList.toggle('landscape', !portrait);
  renderer.setSize(W, H, false); camera.aspect = aspect;
  const dist = Math.max(2.75 / T20, 3.15 / (T20 * aspect));
  camera.position.set(0, 0, dist); camera.updateProjectionMatrix();
  halfH = dist * T20;
  storyY = portrait ? halfH * .2 : .45;
  bgMat.uniforms.uAspect.value = aspect;
  const scale = renderer.getDrawingBufferSize(new THREE.Vector2()).y / (2 * T20);
  fMat.uniforms.uScale.value = scale; starMat.uniforms.uScale.value = scale;
}
window.addEventListener('resize', resize); resize();

const clock = new THREE.Clock();
function frame() {
  const dt = Math.min(clock.getDelta(), 1 / 20); now += dt;
  bgMat.uniforms.uTime.value = now; starMat.uniforms.uTime.value = now; fMat.uniforms.uTime.value = now;
  /* stars drift toward us */
  const sp = starGeo.attributes.position.array; for (let i = 2; i < sp.length; i += 3) { sp[i] += .35 * dt; if (sp[i] > 3) sp[i] -= 29; }
  starGeo.attributes.position.needsUpdate = true;
  stars.rotation.y = .05 * Math.sin(now * .05); stars.rotation.x = .03 * Math.sin(now * .07);

  if (lockYCur === null) { lockYCur = portrait ? halfH * .14 : -.4; lockSCur = portrait ? .95 : .8; }
  if (state === 'thumb') updateThumb(); else lastThumbT = performance.now();
  if (state === 'lock' || state === 'thumb' || state === 'unlocking') {
    let yaw = .42 * Math.sin(now * .45) + .08, pitch = .22 + .04 * Math.sin(now * .31), bob = .05 * Math.sin(now * 1.1);
    let lift = 0, swivel = 0, glow = 0, sc = 1;
    if (state === 'unlocking') {
      const u = now - unlockT, k = smooth(0, .7, u);
      yaw = lerp(yaw, .32, k); pitch = lerp(pitch, .22, k); bob = lerp(bob, 0, k);
      lift = u > .35 ? .5 * easeOutBack((u - .35) / .45) : 0;
      swivel = u > .9 ? -1.35 * easeInOut((u - .9) / .7) : 0;
      glow = smooth(1.2, 2.3, u); sc = 1 + .06 * smooth(1.4, 2.3, u);
      if (u >= 2.35) beginStory();
    }
    /* on wide screens the lock rises and shrinks a little to make room for the thumb pad */
    const raised = !portrait && state !== 'lock';
    lockYCur = lerp(lockYCur, portrait ? halfH * .14 : raised ? .02 : -.4, Math.min(1, dt * 3));
    lockSCur = lerp(lockSCur, portrait ? .95 : raised ? .68 : .8, Math.min(1, dt * 3));
    lock.position.set(0, lockYCur + bob, 0); lock.rotation.set(pitch, yaw, 0, 'YXZ');
    lock.scale.setScalar(lockSCur * sc);
    shackle.position.y = lift; shackle.rotation.y = swivel;
    goldMat.emissive.setRGB(.35 * glow, .24 * glow, .08 * glow); if (state === 'unlocking') goldGlow.material.opacity = Math.max(.35, glow * .55);
  }
  if (state === 'story') {
    updateField(dt, now); updateCaptions(now);
    sway = lerp(sway, swayTarget, Math.min(1, dt * .5)); exposure = lerp(exposure, exposureTarget, Math.min(1, dt * .8));
    fMat.uniforms.uExposure.value = exposure;
    field.rotation.set(.07 * Math.sin(now * .17), sway * Math.sin(now * .23), 0);
    field.position.y = lerp(field.position.y, storyY, Math.min(1, dt * 2));
  }
  updateMusic(dt);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
/* the "I'm sorry." particles use the web font, so make sure it's ready */
if (document.fonts && document.fonts.load) document.fonts.load('italic 500 40px "Cormorant Garamond"').catch(() => {});
requestAnimationFrame(frame);
window.__debug = { get thumb() { return [holding, thumbP]; }, get state() { return state; }, get scene() { return sceneI; }, skip: () => startScene(sceneI + 1, now) };
})();
</script>
